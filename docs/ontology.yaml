# Domain ontology: machine-readable model of the product.
# Read this before designing features. Every concept has: definition, relations, lifecycle (if
# any), invariants, where it lives in code, and `reality` (how real it is today; see levels).
# Human-readable companion: docs/ONTOLOGY.md. Keep both in sync when concepts change.

version: 1
updated: 2026-09-26
product:
  working_name: Ledger of Life   # chosen 2026-09-26; technical identifiers unchanged
  thesis: >-
    Money and assets that everyday life forces people to lock away (rental deposits first)
    should keep working for their owner, without weakening the protection they exist for.
  bigger_picture: >-
    Part of the Stadtstack vision (https://stadtstack.giraeffleaeffle.chatgpt.site): a city in four
    levels (infrastructure, perceive and understand, deliberate and decide, act and implement).
    This app is the personal entry point: one verified identity, many contexts (tenancy, club,
    neighbourhood, city), each showing what matters to the person, what is decided and what they own.
  positioning: >-
    Decided 2026-09-26: a household-ownership app. The person's verified identity is the root;
    everything they own, rent or run is attached through adapters. The rental deposit is the
    first and most complete building block.
  one_sentence: >-
    A home-centred app that shows everything you own, secures rental deposits in escrows that
    earn, lets tenants claim and invest those earnings, and connects the other things a
    household owns that produce value (solar, validators, later cars and home shares).

# How real something is. Every number or feature shown to users must map to one level.
reality_levels:
  live_mainnet: Real assets on a production network. Nothing is at this level yet.
  testnet_real: Real program/contract execution on a test network with test tokens.
  testnet_simulated: Real execution, but an input is simulated on purpose (for example test yield).
  read_only_live: Real third-party data, read-only (Home Assistant, validators, prices).
  prototype: Code exists and ran (tests or a script), but it is not an app feature yet.
  illustration: Visual or copy only; no execution.
  roadmap: Idea recorded; nothing built.

layers:  # product architecture, bottom-up
  - id: identity
    concepts: [Person, Wallet, IdentityAssurance, Credential, DisclosurePolicy, Context, Membership]
  - id: homes
    concepts: [Home, Listing, Application, Agreement, Role]
  - id: custody
    concepts: [Escrow, Operation, Claim, Settlement, Payout]
  - id: earnings
    concepts: [YieldSource, Earnings, Release]
  - id: ownership
    concepts: [Asset, Position, Venue, Distribution, Adapter]
  - id: vision
    concepts: [ServiceChargeAccount, CollateralDeposit, HomeEquityPath, DeviceTokenization, LocalInvestment, LifeTimeline]

concepts:
  Person:
    definition: A verified human using the app. Identity is provider-verified; roles are not stored on the person.
    has: [Wallet (1 per chain family), IdentityAssurance]
    relations: {participates_in: Agreement (via Role), owns: Asset, configures: Adapter}
    code: [src/wallets/identity-policy.ts, src/server/authenticated.ts]
    reality: testnet_real

  Wallet:
    definition: A user-owned signing key per chain family (Solana, EVM), embedded via Privy, unlocked by passkey session.
    invariants:
      - The server never holds a person's wallet key.
      - Sponsors pay fees but have no authority over a person's assets.
    code: [src/wallets/provider.tsx, src/wallets/signing-policy.ts]
    reality: testnet_real

  IdentityAssurance:
    definition: How strongly a Person is verified.
    levels:
      passkey: testnet_real
      backup_email_and_recovery_proof: testnet_real   # skipped in local demo mode (DEMO_SKIP_RECOVERY=1)
      eu_digital_identity_wallet: roadmap              # EUDI Wallet, eIDAS 2.0; German eID as interim
    code: [src/server/recovery.ts, src/components/onboarding.tsx]

  Credential:
    definition: A signed attestation about a Person (identity, age, income band, rental history) held in the Person's own wallet, for example the EU Digital Identity Wallet.
    formats:
      sd_jwt_vc: {reality: testnet_real, note: "Built: OpenID4VP via the EU hosted reference verifier (test environment, TEST-01). Requests the PID birthdate (the current EU PID has no age-over-18 flag) and, opt-in, address.locality; stores only 'adult' and the city. Not tested end-to-end with a phone wallet yet. Linkable across presentations unless issued in single-use batches."}
      iso_mdoc: {reality: roadmap, note: "Selective disclosure; same linkability caveat."}
      integration: {reality: roadmap, note: "App acts as verifier via OpenID4VP; issuance via OpenID4VCI; EU reference wallet, verifier endpoint and Kotlin/Swift libraries at github.com/eu-digital-identity-wallet; commercial SDKs (walt.id, Sphereon, Procivis)."}
      zero_knowledge_predicate: {reality: roadmap, note: "For example 'income >= 3x rent' without revealing income. Not in the EUDI framework yet (an open discussion topic)."}
    relations: {held_by: Person, presented_to: Person (verifier role in an Agreement or Listing)}

  Context:
    definition: A shared space a Person takes part in, with its own members, rules, decisions and feed. A tenancy is one Context; so are a sports club, a house community, a neighbourhood or a city.
    open_ended: true   # kinds are examples, not a closed list; a life has many more
    kinds:
      tenancy: {reality: testnet_real, note: "Agreement plus escrow; the only context built today."}
      city: {reality: read_only_live, note: "Built: 'What is changing in <city>' reads the Stadtstack project atlas read model (atlas-city-read-model-v1, STADTSTACK_ATLAS_URL) for the EU-wallet city (opt-in address.locality) or a chosen city; shows open consultations and latest changes with the atlas's as-of date and review state. The atlas owns collection and review; council data upstream can come from CCF (komma-systems/ccf, OParl)."}
      house_community: {reality: roadmap, note: "Shared building costs; ties to ServiceChargeAccount."}
      examples: [work/employer, health/insurer, mobility, family, learning, club, bank, energy supplier]
    rules:
      - A Context grants roles; the app never infers a role from onboarding choices alone.
      - Each Context applies its own DisclosurePolicy; joining one never reveals membership in another.

  Membership:
    definition: Person × Context × Role (tenant, landlord, member, board, resident), optionally backed by a Credential proving eligibility (adult, resident of the city, club member).
    relations: {person: Person, context: Context, proven_by: Credential}
    reality: roadmap   # tenancy roles exist as Agreement parties; the generic model is not built

  DisclosurePolicy:
    definition: What each party may learn about another, stated as predicates rather than raw data.
    rules:
      - A landlord learns only predicates needed for a decision (verified person, adult, income band), never raw documents.
      - No personal data on-chain. Agreements are hashed; identity is never linked to a wallet address on-chain.
      - For real deposits use a fresh wallet address per tenancy (chains are public).
      - Adapter data stays server-side; share derived facts, not raw readings.
    reality: roadmap   # the on-chain and adapter rules already hold; predicate disclosure is not built

  Role:
    definition: The relation between a Person and an Agreement. One of tenant, landlord, arbitrator.
    invariants:
      - A role is granted by an Agreement, never by a UI selector.
      - One person and one wallet per role per agreement.
      - The arbitrator only acts on a disputed claim.
    note: No global role is chosen at onboarding. Find a home, rent out a home and invitations add context; agreement parties alone grant tenancy roles.
    code: [src/server/agreements.ts#agreementRole]

  Home:
    definition: A physical dwelling. Today it appears only as the subject of a Listing and Agreement.
    future: May be owned (HomeEquityPath) or represented by HomeShare assets.
    reality: illustration

  Listing:
    definition: A landlord's offer of a Home, with rent, required deposit, earnings policy and details (city, rooms, size, move-in date, photos).
    lifecycle: [open, let]
    relations: {offered_by: Person(landlord), receives: Application, results_in: Agreement}
    code: [src/server/listings.ts]
    reality: testnet_real   # off-chain record

  Application:
    definition: A Person's request to rent a Listing. Applicants never see each other.
    lifecycle: [submitted, chosen | not_chosen]
    code: [src/server/listings.ts]

  Agreement:
    definition: The tenancy terms bound to exact parties; accepted by tenant and landlord over one digest.
    fields: [property, network, requiredSecurity, releaseAllowed, "parties{tenant,landlord,arbitrator}", "accepted{tenant,landlord}"]
    lifecycle: [parties_joining, awaiting_acceptance, accepted]
    invariants:
      - The on-chain Escrow's policy hash equals the accepted agreement digest.
      - Changing terms or parties changes the digest and requires new acceptance.
    code: [src/server/agreements.ts]
    reality: testnet_real

  Escrow:
    definition: The custody instance holding one Agreement's deposit. It enforces authority, amounts, recipients and order.
    implementations:
      solana_pull_v2: {code: programs/rental_escrow/src, program: DuFehTh7HJVxTmBhdJiDxsDrd6xXMnQW35jzLPxBeDfb, network: solana-devnet, reality: testnet_real}
      robinhood_rental_escrow: {code: contracts/evm/src/RentalEscrow.sol, network: robinhood-testnet, reality: testnet_real}
      collateral_escrow: {code: contracts/evm/src/CollateralEscrow.sol, network: robinhood-testnet, reality: prototype}
    lifecycle: [awaiting_funding, active, claim_proposed, disputed, settling, closed]
    invariants:
      - The required security is never released as earnings.
      - Payouts go only to fixed, canonical recipient accounts.
      - Pull payouts; a party breaking its own account blocks only itself.
      - Each action consumes the next nonce; replays are rejected.
    relations: {secures: Agreement, supplies_to: YieldSource, produces: Earnings, settles_via: Settlement}

  Operation:
    definition: One signed chain action (possibly a bundle of escrow instructions) persisted before broadcast and reconciled from finalized receipts.
    lifecycle: [prepared, signed, broadcast, unknown, finalized, failed, expired]
    invariants:
      - Signed bytes are immutable; retries resend the same bytes.
      - An expired unsigned review may be replaced only with the same action, deltas, fee ceiling and deployment.
      - Finality requires the expected token deltas and state transition.
    bundles: [fund_and_supply, accept_and_settle, resolve_and_settle, redeem_and_settle]
    code: [src/server/solana-service.ts, src/server/solana-initialization.ts]
    reality: testnet_real

  YieldSource:
    definition: Where an Escrow's idle deposit earns.
    implementations:
      kamino_devnet: {reality: testnet_real, note: "No borrowers on devnet, so 0 % yield."}
      solana_test_credit_yield: {reality: testnet_simulated, note: "Test-only program instruction standing in for interest."}
      robinhood_test_vault: {reality: testnet_simulated, code: contracts/evm/src/testnet/TestnetMarket.sol}
      morpho_mainnet_vault: {reality: prototype, note: "Mainnet-fork tests only."}

  Earnings:
    definition: Value held by an Escrow above the required security (and any funding reserve).
    invariants:
      - claimable = min(idle cash, total value - required security), only while active and if permitted.
    relations: {released_by: Release, to: Asset(CashBalance of tenant)}

  Release:
    definition: The tenant claims Earnings during the tenancy to their own fixed account.
    code: [programs/rental_escrow/src/lib.rs#release_earnings, contracts/evm/src/RentalEscrow.sol#releaseEarnings]
    reality: testnet_simulated   # real execution; yield input simulated

  Claim:
    definition: The landlord's proposed deduction at move-out (0 allowed), with evidence.
    lifecycle: [proposed, accepted | disputed, decided]
    invariants: [claim <= required security, arbitrator decision <= claim]

  Settlement:
    definition: Fixes each party's owed amount after all lending positions are redeemed. It moves no tokens (pull-v2).
    relations: {creates: Payout x2}

  Payout:
    definition: A permissionless transfer of one party's owed amount to its fixed account. The sponsor runs it automatically.
    reality: testnet_real

  Asset:
    definition: Anything a Person owns that has value.
    subclasses:
      CashBalance: {examples: [test USDC (Solana), tUSDG (Robinhood testnet)], reality: testnet_real}
      LockedDeposit: {definition: "The tenant's residual claim on an active Escrow.", reality: testnet_real}
      SecurityToken: {examples: [tSPYx (our Token-2022 copy of SPYx), official Robinhood testnet TSLA], reality: testnet_real, future: [xStocks, Robinhood Stock Tokens on mainnet]}
      HomeShare: {definition: "Fractional claim on a home's value and rent.", reality: illustration}
      ProductiveDevice: {examples: [home solar, staking validator, electric car], reality: read_only_live, note: "Observed through Adapters; not tokenized."}

  Position:
    definition: A quantity of an Asset held in a Person's wallet, valued at a reference price.
    code: [src/server/portfolio.ts, src/server/robinhood-demo.ts#robinhoodHoldings, src/components/assets.tsx]

  Venue:
    definition: Where a Person exchanges cash for an Asset.
    implementations:
      tspyx_test_market: {reality: testnet_real, note: "Atomic co-signed swap at the live SPYx price."}
      robinhood_test_desk: {reality: testnet_real, note: "TestStockDesk at the live TSLAx price."}
      jupiter_xstocks: {reality: read_only_live, note: "Price quotes only."}

  Distribution:
    definition: Value an Asset pays its holder (dividends, rent, staking rewards, energy savings).
    implementations:
      token_multiplier: {reality: testnet_simulated, note: "tSPYx scaled-UI multiplier, as xStocks do."}
      validator_rewards: {reality: read_only_live}
      solar_savings: {reality: read_only_live}
      home_rent_share: {reality: roadmap}

  Adapter:
    definition: A read-only connector that observes an Asset or ProductiveDevice outside the app and reports its value or income.
    invariants:
      - Read-only. Adapters never move money.
      - Credentials are stored server-side, per Person.
    implementations:
      home_assistant_solar: {reality: read_only_live, code: src/server/adapters.ts#readSolar}
      validator: {chains: [gnosis, ethereum, solana], reality: read_only_live, code: src/server/adapters.ts#readValidator}
      electric_car: {reality: roadmap}
      bank_account: {reality: roadmap}

  ServiceChargeAccount:
    definition: Monthly service-charge prepayments (Nebenkosten) held in escrow with a running statement. Consumption shares come live from meters or adapters; landlords add invoices with allocation keys as they arrive; surplus is released or top-ups requested monthly instead of after the annual statement.
    grounding:
      - HeizkostenV requires monthly consumption information where meters are remotely readable (since 2022).
      - §556 BGB gives landlords up to 12 months after the period for the annual statement; the app shortens the wait, not the legal right.
      - Many costs (property tax, insurance, cleaning) are invoiced annually; those remain estimates until the invoice arrives.
    relations: {secured_by: Escrow, fed_by: Adapter (meters, Home Assistant), belongs_to: Agreement}
    reality: roadmap

  LocalInvestment:
    definition: A holding in a company, cooperative or property in the person's own city, shown next to the city's plans (for example a community solar park and the cooperative behind it).
    forms:
      cooperative_share: {reality: roadmap, note: "Genossenschaft (housing, energy); proven, no tokens needed. First step: directory via the Stadtstack atlas."}
      electronic_security: {reality: roadmap, note: "eWpG; electronic shares since 1 Jan 2024 (ZuFinG), crypto registers need a BaFin-licensed operator. The app shows and holds; issuers do the regulated part."}
      crowdfunding: {reality: roadmap, note: "ECSPR: up to EUR 5 million per project owner per 12 months via licensed platforms; link out."}
      tokenized_real_estate: {reality: roadmap, note: "Tokens cannot carry a German land-register title; they represent SPV shares/bonds or profit participation. Test-network illustration only; absorbs HomeEquityPath."}
    rules:
      - No real offers without a licensed partner and legal review; until then illustration or test network, labeled.
    relations: {held_by: Person, located_in: Context (city), shown_in: Portfolio}
    reality: roadmap

  LifeTimeline:
    definition: "The person's private history of places and events: moves, tenancies, deposits returned, memberships, first local investment."
    sources:
      in_app_tenancies: {reality: testnet_real, note: "Derivable from Agreements today; timeline view not built."}
      self_declared_moves: {reality: roadmap, note: "Labeled self-declared."}
      residence_attestation: {reality: roadmap, note: "EU wallet attestation where authorities issue one."}
    rules:
      - Owned by the person; never shared by default. Contexts see derived facts only (e.g. '3 tenancies, all deposits returned').
    relations: {belongs_to: Person, spans: Context}
    reality: roadmap

  CollateralDeposit:
    definition: Securing an Agreement with SecurityTokens (for example 150 %) instead of cash; top-up grace period; forced sale only of what's needed; rest returned in kind.
    code: [contracts/evm/src/CollateralEscrow.sol]
    reality: prototype
    legal_note: German law (§551 BGB) allows other securities only by agreement; the landlord accepts the price risk.

  HomeEquityPath:
    definition: Accumulating HomeShares that count toward acquiring a whole home.
    reality: roadmap
    constraint: A real swap needs a legal wrapper, a notary and the land register; model it as down-payment credit.

  DeviceTokenization:
    definition: Selling shares of a ProductiveDevice's future income (solar, validator, car).
    reality: roadmap
    constraint: Securities and consumer-protection regulation; start with observation (Adapters).

journeys:
  tenant: [choose_role, create_account, fund_wallet, browse_listings, apply, accept_agreement, secure_deposit, claim_earnings_any_time, invest, move_out_respond, receive_payout]
  landlord: [choose_role, create_account, post_listing, choose_applicant, invite_arbitrator, accept_agreement, create_deposit_space, propose_claim, receive_payout]
  arbitrator: [choose_role, create_account, join_by_invitation, decide_disputed_claim]
  owner_of_things: [connect_adapter, see_everything_owned]   # any role
  journey_ui: {stages: [agreement, space, deposit, living, move-out, paid], code: src/server/journey.ts, rule: "Exactly one person has an action per phase; the others see what they wait for."}

networks:
  solana_devnet: {used_for: [Escrow, Operation, tSPYx market], rpc: "Helius (SOLANA_RPC_URL)"}
  robinhood_testnet: {chain_id: 46630, used_for: [RentalEscrow earnings demo, CollateralEscrow prototype, official test TSLA]}
  gnosis_beacon: {used_for: [validator adapter]}
  solana_mainnet_read: {used_for: [validator adapter, SPYx/TSLAx reference prices via Jupiter]}

test_tooling:   # never presented as wallet or user evidence
  test_signers: {code: [src/server/test-signer.ts, scripts/test-signer.mjs], purpose: "Operator keys play people end to end."}
  test_helpers: {code: src/server/test-helpers.ts, gate: "SOLANA_TEST_SIGNER_MODE=1, local store, loopback", purpose: "One real account walks the whole journey."}
  demo_mode: {env: [DEMO_SKIP_RECOVERY, NEXT_PUBLIC_DEMO_SKIP_RECOVERY], effect: "No recovery proof, optional backup email, no Privy confirmation modals."}

# ---------------------------------------------------------------------------
# Vision recorded 2026-09-26 (not built unless marked). Grounding for later work.
# ---------------------------------------------------------------------------
vision:
  scales:
    order: [person, household, neighbourhood, municipality, neighbouring_municipalities, landkreis, land, federation, eu, world]
    rule: Every Context sits at one scale; the app starts from what affects the person and widens outward.
  public_money_flow:
    reality: roadmap
    idea: Show where a person's taxes go and come back, and what their city can realistically spend.
    grounding_de:
      - Income tax is shared; municipalities receive a share (Gemeindeanteil, currently 15 %) allocated by residents' income, so it follows where you live.
      - Trade tax (Gewerbesteuer) goes to the municipality where the employer operates, so it follows where you work.
      - The Land redistributes to municipalities through the kommunaler Finanzausgleich (e.g. Brandenburg to Strausberg); Länder balance each other federally.
      - The municipal budget (Haushalt) and council decisions (RIS/OParl, e.g. via CCF) show what is planned and decided.
    caution: Figures must come from published budgets and statistics with source and as-of date; per-person attribution is an estimate and must be labeled as one.
  measurable_city:
    reality: roadmap
    idea: Sensors and open data (Stadtstack layers 1-2) make needs and the impact of measures measurable, so participation decisions rest on evidence.
  newcomer_welcome:
    reality: roadmap
    idea: On moving to a city, see what is being built (3D atlas), what is decided, and personalised offers such as sports clubs matching interests, possibly with a welcome voucher; invite people to contribute expertise.
    privacy: Interests stay with the person; offers are matched on the device or on explicit consent, never sold or shared by default.
  residence_proof:
    note: The EU PID may omit the address (test issuer form asks birthplace; address fields optional). Fall back to a chosen city, or a residence attestation where issued.
