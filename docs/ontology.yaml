      robinhood_faucet: {reality: testnet_real, note: "Robinhood's public faucet: test ETH for gas and the official test TSLA. External."}
      circle_usdc_faucet: {reality: testnet_real, note: "Circle's public faucet supplies the legacy Solana devnet USDC mint; existing Circle tenancies and manifests without ledgerDepositMint retain that path. Its tokens cannot fund a site-tUSDC tenancy."}
    boundary: "Site tUSDC is tenancy cash and a separately reported wallet balance; Solana portfolio trades remain Circle-USDC-backed."
