# ---------------------------------------------------------------------------
# Vision recorded 2026-09-26 (not built unless marked). Grounding for later work.
# ---------------------------------------------------------------------------
vision:
  scales:
    reality: illustration
    order: [person, household, neighbourhood, municipality, neighbouring_municipalities, landkreis, land, federation, eu, world]
    rule: Every Context sits at one scale; the app starts from what affects the person and widens outward.
    current: "Places links Strausberg city → Märkisch-Oderland district → Brandenburg state → Germany → EU official portals; street/neighbourhood and world feeds are not built."
  public_money_flow:
    reality: illustration
    current: "Places shows the sourced Strausberg budget ordinance's planned 2025 and 2026 investment outlays, never actual spending or personal tax receipts; an independently assumed local-economy balance is explicitly fictional."
    idea: Show where taxes go and what a person's city can realistically spend once the city publishes or provides a complete plan with reusable terms.
    grounding_de:
      - Income tax is shared; municipalities receive 15 % of wage and assessed income tax under GemFinRefG § 1, distributed by statutory keys linked to residence, not 15 % of each resident's personal bill.
      - Trade tax (Gewerbesteuer) belongs to the municipality where business operations take place; Gewerbesteuerumlage reduces gross municipal receipts under GemFinRefG § 6.
      - Brandenburg distributes key allocations to municipalities under BbgFAG; its provisions are legal rules, not a Strausberg allocation dataset.
      - Strausberg's 2025/26 budget ordinance is published, but the detailed plan is offered for inspection under BbgKVerf § 69; an electronic copy may be requested under Brandenburg's AIG.
    caution: Budget figures are planned yearly outlays, not actuals or project allocations; scenario receipts are independent inputs and no personal tax attribution is calculated.
  measurable_city:
    reality: read_only_live
    current: "Partly built: current DWD weather via Bright Sky and nearby outdoor PM2.5/PM10 from uncalibrated sensor.community contributors, with station/sensor distance, observation time, licence and stale status; not city-wide calibrated coverage."
    idea: Broader sensors and open data (Stadtstack layers 1-2) could make needs and effects of measures measurable.
  newcomer_welcome:
    reality: read_only_live
    current: "Partly built: named OSM clubs and sports facilities grouped by type, ODbL object links and Strausberg official directory links; OSM is not an official directory."
    idea: Registration help, interest-based offers, city partners and a welcome voucher are roadmap, not live product features.
    privacy: Interests stay with the person; future matching would occur on device or with explicit consent, never sold or shared by default.
  residence_proof:
    note: The EU PID may omit the address (test issuer form asks birthplace; address fields optional). Fall back to a chosen city, or a residence attestation where issued.
