  TestFunds:
    definition: How a Person gets test money with no value without an operator acting for them.
    implementations:
      site_tusdc_faucet: {reality: testnet_real, note: "Authenticated same-origin POST /api/test-usdc mints site-owned classic-Token devnet tUSDC (6 decimals) to the account's verified Solana wallet. No value, not Circle USDC. Default 10000 tokens once per 24h per account and wallet, capped at 200 requests per UTC day; durable reservation and signed-mint recovery avoid duplicate retry mints. Returns unconfigured, pending with signature, or confirmed with signature and amountAtomic; errors are {error}. Server-only mint authority is a JSON byte array in the deployment Secret."}
      tusdg_self_mint: {reality: testnet_real, note: "The person's own wallet calls the open tUSDG mint on Robinhood Chain testnet (the token caps a call at 10,000; the app asks for 1,000). The server only checks and broadcasts that signed transaction."}
