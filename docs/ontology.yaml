    code: [src/server/timeline.ts, src/components/me.tsx]

  PriceSource:
    definition: Provenance and freshness of a token valuation, distinct from the asset and from an executable sale quote.
    implementations:
      chainlink_rhtsla_mirror: {reality: read_only_live, note: "Chainlink RHTSLA/USD on Robinhood mainnet 4663 copied to 46630. The mirror is not a Chainlink contract; an immutable key can only push bounded prices, not move funds."}
      jupiter_tslax: {reality: read_only_live, note: "Cross-check only for Robinhood TSLA; not a wallet or collateral fallback."}
    invariants:
      - Wallet and collateral use the same mirrored Robinhood token price, converted from the mainnet multiplier to the test-token multiplier with rounding down; the multipliers need not match.
      - Expose source round, source time, copied time, age, stale status and the weekend freshness window (74 h), not an inferred trading-session closure.
      - Missing deployment has no fabricated price; stale pricing freezes price-sensitive actions.
    code: [contracts/evm/src/testnet/MirroredPriceFeed.sol, src/server/tsla-price-mirror.ts]

  CollateralDeposit:
    definition: Home rental security in test shares with no forced sale; Robinhood official TSLA is hosted-proven on 1 October 2026, while deployed Solana tTSLA uses shares-solana/v5 and requires the reviewed manifest and hosted sponsor.
    invariant: Shares stay in the bound escrow until consent, arbitration or the agreed tenant-return timeout permits in-kind payouts; there is no forced sale.
    code: [contracts/evm/src/ShareDeposit.sol, contracts/evm/src/ShareDepositFactory.sol, programs/shares/src/lib.rs, src/server/share-deposit-solana.ts, src/components/share-deposit.tsx]
    reality: testnet_real
    historical_evidence: "Earlier sale-based official-stock and fake-stock cycles do not prove this in-kind share-deposit flow. Hosted three-party run with fresh accounts proven 1 October 2026 (docs/evidence/HOSTED_SHARE_DEPOSIT_ROBINHOOD_TESTNET_2026-10-01.json); timeout exits are contract-tested only."

  BorrowAgainstShares:
    definition: Shared lender-funded test pools against test TSLA; existing Robinhood uses official faucet TSLA/tUSDG and Solana uses classic SPL tTSLA/tUSDC when its reviewed shares deployment is configured.
    rules:
      - Requires a verified shared-market deployment; otherwise honestly undeployed.
      - Solana deployment and initialization with verified on-chain hashes are recorded in docs/evidence/SOLANA_SHARES_DEVNET_DEPLOYMENT_2026-10-05.json; deployment is distinct from hosted-flow proof.
      - Solana faucet requires owner and issuer signatures, wallet cooldown and account quota, with a global fifty-share UTC-day budget; new borrowing is capped at two thousand tUSDC aggregate debt including interest.
      - Borrowing is limited to 50 % loan-to-value and 90 % utilization at a fresh price.
      - Borrowers accrue continuous 5 % nominal annual interest (approximately 5.13 % effective annually, read from the contract); lenders receive it pro rata, without projections.
      - Anyone may liquidate at 80 % loan-to-value with a fresh price, repaying at most 50 % of debt with a 10 % collateral bonus.
      - Bad debt reduces lender value; lender withdrawal is limited by pool cash.
      - Freshness is 26 hours normally and 74 hours Saturday 00:00 UTC through Monday 12:00 UTC.
      - Stale prices do not block adding collateral, repayment or debt-free collateral withdrawal.
      - Robinhood discloses 10,000 tUSDG seed shares at the burn address, including their locked share of interest; this is not a Solana seed claim.
      - No operator price/yield/liquidity withdrawal lever or staged liquidation.
      - Wallet reads never scan the borrower registry; unhealthy loans are a separate on-demand paginated read with a continuation cursor.
      - Immutable collateral issuer and implementation pins are not refreshed silently after upgrades.
      - TSLA paused, pool blocked, implementation changed or collateral shortfall suspends the market; reads expose suspension reasons.
    code: [contracts/evm/src/testnet/SharedLendingPool.sol, programs/shares/src/lib.rs, src/server/shared-market.ts, src/server/shared-market-solana.ts, src/components/share-workflows.tsx]
    reality: testnet_real

  HomeEquityPath:
    definition: Future legally defined housing interests or down-payment credit toward acquiring a home; the current fictional test-unit purchase does not grant those rights.
    reality: roadmap
    constraint: A real swap needs a legal wrapper, a notary and the land register; model it as down-payment credit.

  DeviceTokenization:
    definition: Selling shares of a ProductiveDevice's future income (solar, validator, car).
    reality: roadmap
    constraint: Securities and consumer-protection regulation; start with observation (Adapters).

