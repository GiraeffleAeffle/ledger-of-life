# Domain ontology: machine-readable model of the product.
# Read this before designing features. Every concept has: definition, relations, lifecycle (if
# any), invariants, where it lives in code, and `reality` (how real it is today; see levels).
# Human-readable companion: docs/ONTOLOGY.md. Keep both in sync when concepts change.

version: 1
updated: 2026-09-29
product:
  working_name: Ledger of Life   # chosen 2026-09-26; technical identifiers unchanged
  thesis: >-
    Money and assets that everyday life forces people to lock away (rental deposits first)
    should keep working for their owner, without weakening the protection they exist for.
  bigger_picture: >-
    Part of the Stadtstack vision (https://stadtstack.giraeffleaeffle.chatgpt.site): a city in four
    lenses (infrastructure; observe and explain; deliberate and decide; act and check).
    The same place persists across lenses and measured effects feed back into knowledge.
    This app is the personal entry point: one verified identity, many contexts (tenancy, club,
    neighbourhood, city), with evidence and scenarios visibly distinguished.
  positioning: >-
    Decided 2026-09-26: a household-ownership app. The person's verified identity is the root;
    everything they own, rent or run is attached through adapters. The rental deposit is the
    first and most complete building block.
  one_sentence: >-
    A home-centred app that shows everything you own, secures rental deposits in escrows that
    earn, lets tenants claim and invest those earnings, and connects the other things a
    household owns that produce value (solar, validators, later cars and home shares).

# How real something is. Every number or feature shown to users must map to one level.
reality_levels:
  live_mainnet: Real assets on a production network. Nothing is at this level yet.
  testnet_real: Real program/contract execution on a test network with test tokens.
  testnet_simulated: Real execution, but an input is simulated on purpose (for example test yield).
  read_only_live: Real third-party data, read-only (Home Assistant, validators, prices).
  self_declared_local: A person's unverified pins or public-project bookmarks/comparison state kept only on their device; never sent to the server.
  self_declared_private: Unverified information entered by the person and stored under their authenticated account, not shared with other contexts.
  prototype: A working limited app flow or counterpart, not a production financial or legal workflow.
  illustration: Labeled exploratory visual or computation with fictional inputs; no real transaction or measured outcome.
  roadmap: Idea recorded; nothing built.

layers:  # product architecture, bottom-up
  - id: identity
    concepts: [Person, Wallet, IdentityAssurance, Credential, DisclosurePolicy, Context, Membership, CitySignal, MyPlaces, ArrivalGuide]
  - id: homes
    concepts: [Home, Listing, Application, Agreement, Role]
  - id: custody
    concepts: [Escrow, Operation, Claim, Settlement, Payout, CollateralDeposit]
  - id: earnings
    concepts: [YieldSource, Earnings, Release]
  - id: ownership
    concepts: [Asset, Position, BorrowAgainstShares, Venue, Distribution, Adapter]
  - id: local_services
    concepts: [LocalInferenceRequest, InferencePayment, InferenceHost, HostEconomicsScenario]
  - id: civic_system
    concepts: [Organization, CityEvent, Project, Funding, Activity, Output, Outcome, Indicator, Scenario, RelationEvidence]
  - id: vision
    concepts: [ServiceChargeAccount, HomeEquityPath, DeviceTokenization, LocalInvestment, LifeTimeline]

concepts:
  Person:
    definition: A verified human using the app. Identity is provider-verified; roles are not stored on the person.
    has: [Wallet (1 per chain family), IdentityAssurance]
    relations: {participates_in: Agreement (via Role), owns: Asset, configures: Adapter, sees_relevant: CitySignal (matched on device with MyPlaces)}
    code: [src/wallets/identity-policy.ts, src/server/authenticated.ts]
    reality: testnet_real

  Wallet:
    definition: A user-owned signing key per chain family (Solana, EVM), embedded via Privy, unlocked by passkey session.
    invariants:
      - The server never holds a person's wallet key.
      - Sponsors pay fees but have no authority over a person's assets.
    code: [src/wallets/provider.tsx, src/wallets/signing-policy.ts]
    reality: testnet_real

  IdentityAssurance:
    definition: How strongly a Person is verified.
    levels:
      passkey: testnet_real
      backup_email_and_recovery_proof: testnet_real   # skipped in local demo mode (DEMO_SKIP_RECOVERY=1)
      eu_digital_identity_wallet: testnet_real # OpenID4VP PID adult check and opt-in locality built; phone-wallet iOS flow confirmed in test environment, not production issuance.
    session_verification:
      - Privy access JWT must verify against the app's ES256 public key/JWKS with exact issuer, audience and expiry; then current provider user and embedded-wallet sole ownership are checked.
      - Invalid, expired or foreign credentials fail closed; JWKS transport failure is service unavailable, never anonymous success or a forced sign-out.
    code: [src/server/identity.ts, src/wallets/privy-access-token.ts, src/wallets/identity-policy.ts, src/server/recovery.ts, src/components/onboarding.tsx]

  Credential:
    definition: A signed attestation about a Person (identity, age, income band, rental history) held in the Person's own wallet, for example the EU Digital Identity Wallet.
    formats:
      sd_jwt_vc: {reality: testnet_real, note: "OpenID4VP via EU hosted reference verifier (TEST-01); iOS phone-wallet presentation confirmed. Requests PID birthdate and, opt-in, address.locality; stores only adult and city. Credential linkability across presentations remains unless single-use batches are issued."}
      iso_mdoc: {reality: roadmap, note: "Selective disclosure; same linkability caveat."}
      integration: {reality: testnet_real, note: "Verifier-side OpenID4VP test integration built; issuance via OpenID4VCI and production wallet/provider integration are not built."}
      zero_knowledge_predicate: {reality: roadmap, note: "For example 'income >= 3x rent' without revealing income. Not in the EUDI framework yet (an open discussion topic)."}
    relations: {held_by: Person, presented_to: Person (verifier role in an Agreement or Listing)}

  Context:
    definition: A shared space a Person takes part in, with its own members, rules, decisions and feed. A tenancy is one Context; so are a sports club, a house community, a neighbourhood or a city.
    open_ended: true   # kinds are examples, not a closed list; a life has many more
    kinds:
      tenancy: {reality: testnet_real, note: "Agreement plus escrow; the only transactional shared context built today. City is read-only."}
      city: {reality: read_only_live, note: "Built read-only: atlas projects/consultations and public Stadtstack CitySignals for EU-wallet or chosen city, with as-of, review and geometry precision. Private MyPlaces matching runs on device. Bright Sky/DWD weather, citizen PM and OSM clubs retain their own times/licences. Strausberg ALLRIS links are outbound only; the published 2025/26 ordinance has headline planned investment outlays, not actual spending or a detailed plan."}
      house_community: {reality: roadmap, note: "Shared building costs; ties to ServiceChargeAccount."}
      examples: [work/employer, health/insurer, mobility, family, learning, club, bank, energy supplier]
    rules:
      - A Context grants roles; the app never infers a role from onboarding choices alone.
      - Each Context applies its own DisclosurePolicy; joining one never reveals membership in another.

  CitySignal:
    definition: A public, versioned city-wide statement or place published by Stadtstack; its source, as-of, review state, geometry precision and (for LLM extraction) faithfulness score qualify every claim.
    source: stadtstack-data/out/catalogue.json plus cities/<cityId>/signals.min.geojson for browsing and signals.geojson for detail
    reality: read_only_live
    levels:
      public_snapshot: {reality: read_only_live, note: "Actual sourced city data; candidate means not yet human-reviewed and coverage is not a complete city inventory."}
      fictional_test_fixture: {reality: illustration, note: "Hand-written fixture under test/fixtures only; never app data."}
      compact_browse: {reality: read_only_live, note: "Map and lists read compact public records; selecting an item loads full sources by public ID only."}
    relations: {located_in: Context (city), relevant_to: Person (matched in the browser with MyPlaces)}
    code: [src/server/city-signals.ts, app/api/city-signals/route.ts, src/components/personal-map.tsx]

  Organization:
    definition: A public body, enterprise, cooperative or builder in a city Context; sourced Strausberg profiles describe products, participation channels, published opportunities and documented group membership. These independent organizations are separate from fictional test issuers.
    relations: {participates_in: Context, may_deliver: Project, may_perform: Activity}
    reality: read_only_live
    rules:
      - A published job or partner-network invitation is attributed source information, not guaranteed availability or a signed contract.
      - No supplier relationship, map location or issuer affiliation is inferred from proximity, sector or group membership.
    code: [src/data/cities/strausberg-organizations.ts, src/components/organization-profile.tsx]

  CityEvent:
    definition: A source-attributed public event with publisher identity, optional actual event time, venue text and independently evidenced point geometry.
    relations: {published_by: Organization, located_in: Context (city)}
    invariants:
      - Publication time never substitutes for eventStart; unknown dates and locations remain unknown.
      - Calendar enrichment joins publisher record ID and title, not loose similarity or nearby venues.
      - Coordinates retain exact or approximate precision plus location source, geometry licence and attribution; null geometry never creates a pin.
    reality: read_only_live
    code: [stadtstack-data/src/feeds.ts, stadtstack-data/src/event-venues.ts, src/server/city-signals.ts, src/components/city-feed.tsx, src/components/personal-map.tsx]

  Project:
    definition: One place or policy across map, status, outputs and outcomes; published CitySignal IDs retain original source status and geometry, while an unlocated official report can document a project without gaining an invented CitySignal.
    relations: {evidenced_by: CitySignal or source report, may_receive: Funding, may_trigger: Activity, produces: Output, may_affect: Outcome}
    rule: A plan boundary is proposed-area context, never an affected-area or built-footprint claim; unlocated projects stay off map. Browsing a historical project in another city does not change chosen city or device pins.
    code: [src/components/civic-place-lenses.tsx, src/data/civic-outcome-evidence.ts]
    reality: read_only_live

  ProjectFollow:
    definition: A browser-local, account-scoped bookmark of a public city plus canonical researched case or exact signal; linked signals share one case target. Not membership, role, investment or notification subscription.
    relations: {person_marks: Project, compared_against: CitySignal or researched case evidence}
    invariants:
      - First follow re-reads every current full public signal in the target; partial/failed linked reads cannot establish a baseline, and material already visible at follow time is not a fresh decision.
      - An in-flight first follow cannot save after any intervening selection/review generation, even if the same project is selected again; failed/late reads do not replace newer detail.
      - Sourced status/date/evidence-review, meaningful published next-step note changes, budget-description figures and structured output/measurement facts create unread changes; metadata and cosmetic text do not.
      - Every pending event survives other refreshes, absent targets and outages until individually acknowledged; newer-event acknowledgment does not consume an older unseen event.
      - Unlocated researched cases are app evidence records, not live PDF monitoring; linked cases require every published signal source.
      - Disappearing individual facts are labelled no longer stated, not zero or cancellation. Unfollow invalidates in-flight source reads for that instance.
      - Only the public city and exact signal ID enter refresh requests; private follow state, pins and interests never upload.
    code: [src/components/project-following.ts, src/components/use-project-following.ts, src/components/civic-place-lenses.tsx, src/components/today.tsx]
    reality: self_declared_local

  Funding:
    definition: A source and allocation of capital for an Organization or Project; reported planned-versus-provisional trial spending is not proof of its funding source, appropriation, final cost or an investment offer. Planned annual public budget outlays are not actual expenditure.
    relations: {may_finance: Activity, belongs_to: Organization}
    reality: illustration

  Activity:
    definition: Work, procurement, construction or service undertaken by an Organization; the Münster trial reports added bus-only lane work, whereas a scenario allocates fictional capital among wages, suppliers, external purchases and reserve.
    relations: {performed_by: Organization, may_produce: Output}
    reality: read_only_live

  Output:
    definition: A separately sourced delivered, reported or planned thing such as a phase-one facility, scheduled opening or nominal solar capacity; each output retains its own basis, URL, locator and date (null if unknown), and none proves benefit.
    relations: {produced_by: Project, may_contribute_to: Outcome}
    code: [src/data/civic-outcome-evidence.ts]
    reality: read_only_live

  Outcome:
    definition: A change in lived conditions assessed with an Indicator and comparable baseline/follow-up; an observed before/during difference is not an isolated causal benefit without control for other conditions.
    relations: {may_follow: Output, assessed_by: Indicator, feeds_back_to: Context}
    code: [src/components/civic-place-lenses.tsx]
    reality: read_only_live

  Indicator:
    definition: A quantity with unit, measurement boundary, sample period, evidence basis and exact source locator; Münster's official GPS report compares complete-route bus running-time means (251 vs 235 seconds in 2019/2021), not summed segment means or passenger-wide benefits. Other cases retain their missing benefit indicators; nearby PM/weather is not project evidence.
    relations: {assesses: Outcome, sourced_from: CitySignal or official project report}
    code: [src/data/civic-outcome-evidence.ts]
    reality: read_only_live

  Scenario:
    definition: A fictional, editable allocation and independent municipal-balance assumption; never a municipal forecast, investment offer, portfolio Position or public CitySignal.
    relations: {models: Activity, hypothesizes: Outcome, uses_assumed: Funding}
    invariants:
      - Wages plus local suppliers plus external purchases plus reserve equal illustrative capital exactly.
      - Wage allocation divided by assumed cost per job-year yields job-years, not permanent hires.
      - Municipal receipts, redistribution and service costs are independently assumed; no conversion from investment capital to local tax receipts.
    code: [src/components/civic-system.ts, src/components/civic-loop.tsx]
    reality: illustration

  RelationEvidence:
    definition: >-
      A source-backed actor → role → project/work/data relation has an exact source locator;
      a proposed relation describes a plan but not its effects; a modeled causal assumption
      uses a dashed line with editable assumptions and cannot inherit adjacent source status.
    modes: [evidence_backed, proposed, modeled_assumption]
    rule: Reported work and a measured before/during indicator do not alone prove a causal benefit; planned spending and provisional actual costs do not reveal funding source.
    reality: read_only_live


  MyPlaces:
    definition: Optional home and work pins self-declared by clicking the map or explicitly requesting browser geolocation, plus self-selected interests for local ranking.
    reality: self_declared_local
    invariants:
      - Home and work coordinates are stored only in this device's per-city localStorage and can be removed.
      - Sport, kids, shops, health, culture, nature and volunteering interests are stored only on this device and rank places and council items locally; the welcome guide reads and writes the same interests.
      - Neither exact coordinates, interests nor a commute route is sent to our server or a geocoder/router.
      - The browser matches public CitySignals within 1 km of home and an approximate 400 m straight-line commute corridor only when viewing the pin's city.
      - Map tile requests reveal the viewed map area to OpenFreeMap, not saved pin coordinates.
    relations: {belongs_to: Person, matches: CitySignal (on device)}
    code: [src/components/personal-map.tsx, src/components/personal-map-relevance.ts]

  ArrivalGuide:
    definition: A city's welcome guide for newcomers, meant to be handed over at registration as a link or QR code. It holds a sourced plan for the first months by phase, the organisations to ask, and the clubs, facilities and groups a newcomer can try. Curated public information, not an official city service.
    reality: read_only_live   # dated snapshots of real public pages, like CitySignal snapshots; nothing here is live-fetched except the published city feed
    invariants:
      - Every step, contact and group cites a page that was read, with the date it was read. A step is official only when its source is the city, the district, the state, the federal government or a body they own.
      - Contacts are organisations and facilities. No private person's phone number or email is published.
      - The page needs no account, sets no cookies and loads nothing from a third party. The reader's situation and interests are chosen and kept on the device; nothing ticked or typed is sent to the server.
      - A situation or an interest highlights and orders steps, groups and events; it never hides one.
      - An entry whose source is inactive, or that cannot be verified, is dropped rather than shown with a caveat.
    relations: {about: Context (city), personalised_by: MyPlaces interests (on device), draws_on: CitySignal and CityEvent (published feed)}
    code: [src/data/arrival/, src/data/interests.ts, src/components/arrival-guide.tsx, src/components/arrival-logic.ts, src/server/welcome-feed.ts, "app/welcome/[city]/page.tsx"]

  Membership:
    definition: Person × Context × Role (tenant, landlord, member, board, resident), optionally backed by a Credential proving eligibility (adult, resident of the city, club member).
    relations: {person: Person, context: Context, proven_by: Credential}
    reality: roadmap   # tenancy roles exist as Agreement parties; the generic model is not built

  DisclosurePolicy:
    definition: What each party may learn about another, stated as predicates rather than raw data.
    rules:
      - A landlord learns only predicates needed for a decision (verified person, adult, income band), never raw documents.
      - No personal data on-chain. Agreements are hashed; identity is never linked to a wallet address on-chain.
      - For real deposits use a fresh wallet address per tenancy (chains are public).
      - Adapter data stays server-side; share derived facts, not raw readings.
    reality: roadmap   # the on-chain and adapter rules already hold; predicate disclosure is not built

  Role:
    definition: The relation between a Person and an Agreement. One of tenant, landlord, arbitrator.
    invariants:
      - A role is granted by an Agreement, never by a UI selector.
      - One person and one wallet per role per agreement.
      - The arbitrator only acts on a disputed claim.
    note: No global role is chosen at onboarding. Find a home, rent out a home and invitations add context; agreement parties alone grant tenancy roles.
    code: [src/server/agreements.ts#agreementRole]

  Home:
    definition: A physical dwelling. Today it appears only as the subject of a Listing and Agreement.
    future: May be owned (HomeEquityPath) or represented by HomeShare assets.
    reality: illustration

  Listing:
    definition: A landlord's offer of a Home, with rent, required deposit, earnings policy and details (city, rooms, size, move-in date, photos).
    lifecycle: [open, let | closed]   # closed: the landlord withdrew it before choosing; a chosen (let) listing cannot be cancelled
    relations: {offered_by: Person(landlord), receives: Application, results_in: Agreement}
    code: [src/server/listings.ts]
    reality: testnet_real   # off-chain record

  Application:
    definition: A Person's request to rent a Listing. Applicants never see each other.
    lifecycle: [submitted, chosen | not_chosen | withdrawn]   # withdrawn: removed by the applicant while the listing is open
    code: [src/server/listings.ts]

  Agreement:
    definition: The tenancy terms bound to exact parties; accepted by tenant and landlord over one digest.
    fields: [property, network, requiredSecurity, releaseAllowed, "parties{tenant,landlord,arbitrator}", "accepted{tenant,landlord}"]
    lifecycle: [parties_joining, awaiting_acceptance, accepted]
    invariants:
      - The on-chain Escrow's policy hash equals the accepted agreement digest.
      - Changing terms or parties changes the digest and requires new acceptance.
    code: [src/server/agreements.ts]
    reality: testnet_real

  Escrow:
    definition: The custody instance holding one Agreement's deposit. It enforces authority, amounts, recipients and order.
    implementations:
      solana_pull_v2: {code: programs/rental_escrow/src, program: DuFehTh7HJVxTmBhdJiDxsDrd6xXMnQW35jzLPxBeDfb, network: solana-devnet, reality: testnet_real}
      robinhood_rental_escrow: {code: contracts/evm/src/RentalEscrow.sol, network: robinhood-testnet, reality: testnet_real}
      collateral_escrow: {code: contracts/evm/src/CollateralEscrow.sol, network: robinhood-testnet, reality: prototype}
    lifecycle: [awaiting_funding, active, claim_proposed, disputed, settling, closed]
    invariants:
      - The required security is never released as earnings.
      - Payouts go only to fixed, canonical recipient accounts.
      - Pull payouts; a party breaking its own account blocks only itself.
      - Each action consumes the next nonce; replays are rejected.
    relations: {secures: Agreement, supplies_to: YieldSource, produces: Earnings, settles_via: Settlement}

  Operation:
    definition: One signed chain action (possibly a bundle of escrow instructions) persisted before broadcast and reconciled from finalized receipts.
    lifecycle: [prepared, signed, broadcast, unknown, finalized, failed, expired]
    invariants:
      - Signed bytes are immutable; retries resend the same bytes.
      - An expired unsigned review may be replaced only with the same action, deltas, fee ceiling and deployment.
      - Finality requires the expected token deltas and state transition.
    bundles: [fund_and_supply, accept_and_settle, resolve_and_settle, redeem_and_settle]
    code: [src/server/solana-service.ts, src/server/solana-initialization.ts]
    reality: testnet_real

  YieldSource:
    definition: Where an Escrow's idle deposit earns.
    implementations:
      kamino_devnet: {reality: testnet_real, note: "No borrowers on devnet, so 0 % yield."}
      solana_test_credit_yield: {reality: testnet_simulated, note: "Test-only program instruction standing in for interest."}
      robinhood_test_vault: {reality: testnet_simulated, code: contracts/evm/src/testnet/TestnetMarket.sol}
      morpho_mainnet_vault: {reality: prototype, note: "Mainnet-fork tests only."}

  Earnings:
    definition: Value held by an Escrow above the required security (and any funding reserve).
    invariants:
      - claimable = min(idle cash, total value - required security), only while active and if permitted.
    relations: {released_by: Release, to: Asset(CashBalance of tenant)}

  Release:
    definition: The tenant claims Earnings during the tenancy to their own fixed account.
    code: [programs/rental_escrow/src/lib.rs#release_earnings, contracts/evm/src/RentalEscrow.sol#releaseEarnings]
    reality: testnet_simulated   # real execution; yield input simulated

  Claim:
    definition: The landlord's proposed deduction at move-out (0 allowed), with evidence.
    lifecycle: [proposed, accepted | disputed, decided]
    invariants: [claim <= required security, arbitrator decision <= claim]

  Settlement:
    definition: Fixes each party's owed amount after all lending positions are redeemed. It moves no tokens (pull-v2).
    relations: {creates: Payout x2}

  Payout:
    definition: A permissionless transfer of one party's owed amount to its fixed account. The sponsor runs it automatically.
    reality: testnet_real

  Asset:
    definition: Anything a Person owns that has value.
    subclasses:
      CashBalance: {examples: [test USDC (Solana), tUSDG (Robinhood testnet)], reality: testnet_real}
      LockedDeposit: {definition: "The tenant's residual claim on an active Escrow.", reality: testnet_real}
      SecurityToken: {examples: [tSPYx (our Token-2022 copy of SPYx), official Robinhood testnet TSLA], reality: testnet_real, future: [xStocks, Robinhood Stock Tokens on mainnet]}
      HomeShare: {definition: "Fractional claim on a home's value and rent.", reality: illustration}
      ProductiveDevice: {examples: [home solar, staking validator, electric car], reality: read_only_live, note: "Observed through Adapters; not tokenized. Operated in Money → Devices & income and configured in Me (see docs/INFORMATION_ARCHITECTURE.md).", code: [src/components/device-readings.tsx, src/server/adapters.ts]}

  Position:
    definition: A quantity of an Asset held in a Person's wallet or in a test contract as their deposit/loan collateral, valued at a stated price.
    code: [src/server/portfolio.ts, src/server/robinhood-demo.ts#robinhoodHoldings, src/server/share-workflows.ts, src/components/assets.tsx]

  Venue:
    definition: Where a Person exchanges cash for an Asset.
    implementations:
      tspyx_test_market: {reality: testnet_real, note: "Atomic co-signed swap at the live SPYx price."}
      robinhood_test_desk: {reality: testnet_real, note: "TestStockDesk at the live TSLAx price."}
      jupiter_xstocks: {reality: read_only_live, note: "Price quotes only."}

  Distribution:
    definition: Value an Asset pays its holder (dividends, rent, staking rewards, energy savings).
    implementations:
      token_multiplier: {reality: testnet_simulated, note: "tSPYx scaled-UI multiplier, as xStocks do."}
      validator_rewards: {reality: read_only_live}
      solar_savings: {reality: read_only_live}
      home_rent_share: {reality: roadmap}

  Adapter:
    definition: A connector between the person's assets and an external system; observation adapters and signed financial flows have different authority.
    invariants:
      - Home Assistant, validator and public-price adapters are read-only in what this app does with them. A credential the person supplies (a Home Assistant token) may allow more than reading, and the adapter's explanation says so.
      - Financial actions require the existing user-authorized signing policy and persist as Operation; a read failure never implies a transaction failed.
      - Provider credentials are stored server-side, per Person; the server never holds the person's wallet key.
      - A saved connection is not a healthy provider or proof of asset ownership; failed reads remain unavailable.
      - Me owns device configuration; Home and Money show observations and link to that single settings location.
    catalogue:
      topics: [identity, home, money, devices, places]
      definition: src/data/ledger-catalogue.ts
      state: src/components/ledger-adapter-state.ts
      surfaces: [src/components/ledger-overview.tsx, src/components/ledger-adapters.tsx, src/components/ideas.tsx]
      note: Shared display/action metadata, not a common backend ingestion or execution API. Existing readers retain value provenance and timestamps.
    explanation:
      definition: src/data/ledger-catalogue.ts#AdapterExplanation
      fields: [brings, reads, keeps, visibility, needs, disconnect, effort, reality, caveat]
      rules:
        - Every adapter explains itself in plain language, and each statement is checked against the code that implements it, including what the operator can see and what disconnecting does not undo.
        - reality is one of the ontology reality levels. A roadmap adapter (connection future) has effort "not available yet", reality roadmap and says it does nothing yet; a live adapter never does.
        - Getting-started steps are adapters marked setup, in order; the guide adds no second list.
      surfaces: [src/components/ledger-adapters.tsx, src/components/getting-started.tsx]
    configuration:
      api: app/api/adapters/route.ts
      ui: src/components/adapter-settings.tsx
      rules:
        - Authenticated GET returns redacted saved configuration without provider reads.
        - Same-origin authenticated POST saves or removes one account-owned connection.
        - Home Assistant tokens never return to the client; blank preserves the saved token.
        - Removal deletes this ledger's stored credential, not the provider-issued token.
    implementations:
      home_assistant_solar: {reality: read_only_live, code: src/server/adapters.ts#readSolar}
      validator: {chains: [gnosis, ethereum, solana], reality: read_only_live, code: src/server/adapters.ts#readValidator}
      signed_financial_flows: {reality: testnet_real, code: src/server/share-workflows.ts, note: "User-approved signed testnet actions; not passive read adapters."}
      electric_car: {reality: roadmap}
      bank_account: {reality: roadmap}

  ServiceChargeAccount:
    definition: Future monthly service-charge prepayments (Nebenkosten) secured alongside the deposit, with a running statement. The current prototype is only an example statement using a landlord-set test prepayment, example annual allocations and optional live daily Home Assistant consumption; no escrow funding, legal bill or payout is implemented.
    grounding:
      - HeizkostenV requires monthly consumption information where meters are remotely readable (since 2022).
      - §556 BGB gives landlords up to 12 months after the period for the annual statement; the app shortens the wait, not the legal right.
      - Many costs (property tax, insurance, cleaning) are invoiced annually; those remain estimates until the invoice arrives.
    relations: {secured_by: Escrow (future), fed_by: Adapter (Home Assistant daily consumption), belongs_to: Agreement}
    reality: prototype
    code: [src/server/service-charges.ts, src/components/service-charges.tsx]

  LocalInvestment:
    definition: Wallet-held units of a distinctly fictional housing or workshop issuer on Robinhood testnet; actual test-token transfers are separate from real cooperative research leads and hypothetical city effects.
    forms:
      fictional_test_units: {reality: testnet_simulated, note: "Distinct fixed-supply tHOME/tWORK tokens, shared 6-decimal test USD, operator-set test issue price; no real issuer, cooperative or property rights."}
      cooperative_share: {reality: roadmap, note: "Genossenschaft (housing, energy); proven, no tokens needed. First step: directory via the Stadtstack atlas."}
      electronic_security: {reality: roadmap, note: "eWpG; electronic shares since 1 Jan 2024 (ZuFinG), crypto registers need a BaFin-licensed operator. The app shows and holds; issuers do the regulated part."}
      crowdfunding: {reality: roadmap, note: "ECSPR: up to EUR 5 million per project owner per 12 months via licensed platforms; link out."}
      tokenized_real_estate: {reality: roadmap, note: "Tokens cannot carry a German land-register title; they represent SPV shares/bonds or profit participation. Test-network illustration only; absorbs HomeEquityPath."}
    rules:
      - No real offers without a licensed partner and legal review; until then illustration or test network, labeled.
      - Buying project units does not repay a share-backed loan; its collateral and debt remain separate.
      - Test issue price is not market/resale value. Project units stay outside the priced-asset subtotal; shared cash is counted once.
      - Each exact spend is wallet-authorized; approval alone is not a completed investment.
      - Completion requires the reviewed transaction, canonical confirmed receipt and exact cash/unit effects. Unknown evidence stays unresolved.
      - Fictional issuer map markers are illustrative placements, not real property identities or offers.
    relations: {hypothetically_funds: Organization (Scenario only), located_in: Context (city illustration), held_by: Person (test wallet units)}
    reality: testnet_simulated
    code: [src/data/local-investments.ts, src/components/local-investments.tsx, src/components/city-flywheel.tsx, src/server/local-investments.ts, app/api/local-investments/route.ts, contracts/evm/src/testnet/FictionalCityUnit.sol]

  LocalInferenceRequest:
    definition: An owned immutable question executed through an outbound paired Ollama connector or the configured direct local endpoint; complete results and reported token/timing observations are persisted, never replaced by canned answers.
    relations: {requested_by: Person or visitor session, served_by: InferenceHost or Adapter, may_require: InferencePayment}
    lifecycle: [payment_required, approval_required, ready, running, settling, completed, failed, interrupted, expired]
    invariants:
      - Server configuration fixes model and options; the quote binds provider host, payout wallet, question privacy scope and ownership, which cannot change on replay.
      - A complete paid result is persisted before settlement and delivered only with a confirmed receipt.
      - Incomplete or interrupted inference never becomes paid revenue; an unresolved payment reuses its exact journal rather than recomputing the answer.
      - A connector host reads questions in clear; city hosts receive only explicitly public questions, while own-host-only is the default. Signatures do not prove which model ran or prevent host retention.
      - Free access establishes a revocable HttpOnly visitor session before execution, permits three attempts per visitor and thirty per UTC day, and creates no paid receipt.
      - Clearing a visitor session revokes saved and in-flight access and removes that visitor's saved question and answer text at once; it does not revoke the person's independent paid receipts.
      - Question and answer text is retained only while the request is running, settling or has a payment in flight, then removed after a grace period (default 600 s, `LOCAL_AI_TEXT_GRACE_SECONDS`); fingerprint, usage, state and the payment receipt are kept. A removed request shows no text. On the SQLite store the removal also reaches the database file and its write-ahead log (`secure_delete` plus a truncating checkpoint, `Store.reclaim`); on Postgres, dead rows remain until autovacuum.
    reality: prototype
    code: [src/server/local-ai.ts, src/server/local-ai-retention.ts, src/server/local-ai-runtime.ts, src/server/local-ai-session.ts, src/components/local-ai.tsx, "app/(wallet)/library/page.tsx"]

  InferencePayment:
    definition: Official x402 v2 exact/Permit2 authorization and settlement of 10000 atomic tUSDG for one completed local answer on eip155:46630.
    relations: {authorizes: LocalInferenceRequest, paid_by: Person (owned wallet), settles_in: Asset}
    invariants:
      - Approval is a finite 100000-atomic Permit2 budget; each answer needs a separate bounded authorization.
      - The dedicated facilitator pays gas but cannot alter the payer, recipient, asset or amount.
      - Request ownership and a globally reserved payer/nonce bind authorization to one immutable request; base Permit2 does not cryptographically sign the prompt.
      - Immutable unsigned envelope and exact signed bytes are durable before broadcast; canonical receipt and matching token effects establish settlement.
      - Only settled transfers count as recorded receipts; signatures, quotes, failed jobs and free access do not.
    reality: testnet_real
    code: [src/server/local-ai-payment.ts, src/server/local-ai-operations.ts, src/wallets/inference-signing.ts, src/components/local-ai-payment.ts, scripts/setup-local-ai-facilitator.mjs]

  InferenceHost:
    definition: An operator-invited account's GPU reached exclusively through an outbound Ed25519-authenticated connector, with a verified EVM payout wallet and reported models and liveness.
    relations: {owned_by: Person, serves: LocalInferenceRequest, receives: InferencePayment}
    lifecycle: [pending, active, revoked]
    invariants:
      - A ten-minute single-use pairing code binds the host public key; approval requires a verified EVM wallet in LOCAL_AI_HOST_OWNER_WALLETS and payout is a verified wallet of that account.
      - The private key and optional Home Assistant wake token stay on the connector; the app never dials a connector-supplied URL.
      - Signed method, path, timestamp, nonce and body hash prevent tampering and replay within a sixty-second clock window.
      - A recent heartbeat reports online or asleep; absent heartbeats report offline. Liveness and model names are host claims, not hardware or execution attestation.
      - One lease per host; assigned hosts alone fetch and answer bounded text-only jobs. Pickup expires after thirty seconds and completion after ninety seconds, without charging failures.
      - Queued question copies live only in bounded process memory and are discarded after completion, timeout, revocation or process exit; existing database retention rules still apply.
      - One app replica is required; multi-replica queue and coordinated leases are not built.
    reality: prototype
    code: [src/server/local-ai-hosts.ts, host-connector/connector.mjs, app/api/local-ai/hosts, src/components/local-ai-host.tsx]


  HostEconomicsScenario:
    definition: Editable thirty-day euro planning from assumed hardware allocation, whole-host watts, online hours, electricity tariff, other costs, prices and paid/free demand.
    relations: {may_use_timing_from: LocalInferenceRequest}
    invariants:
      - Euro assumptions never convert test-token receipts to fiat or establish actual profit.
      - Observed request timing can bound compute demand but is not sustained capacity, measured power or customer demand.
      - Electricity includes all entered online hours, including idle time; free access still needs a host budget.
    reality: illustration
    code: [src/components/local-ai-economics.ts, src/components/local-ai-host.tsx]

  LifeTimeline:
    definition: "The person's private history of places and events: moves, tenancies, deposits returned, memberships, first local investment."
    sources:
      in_app_tenancies: {reality: testnet_real, note: "Built compact timeline entries derived from the person's Agreements."}
      self_declared_moves: {reality: self_declared_private, note: "Built earlier-place entries, explicitly self-declared and private to the account."}
      residence_attestation: {reality: roadmap, note: "EU wallet attestation where authorities issue one."}
    rules:
      - Owned by the person; never shared by default. Derived disclosure to another context is planned, not implemented.
    relations: {belongs_to: Person, spans: Context}
    reality: prototype
    implementation: Partial; tenancy and earlier-place entries built, verified residence and broader milestones planned.
    code: [src/server/timeline.ts, src/components/me.tsx]

  CollateralDeposit:
    definition: A working Robinhood Chain testnet flow secures a separate illustrated deposit with fake tTSLA at a simulated per-wallet price; existing legacy positions may use official test TSLA. It is not a cash deposit in a production rental agreement.
    lifecycle: [test_landlord_accepts, tenant_pledges_shares, simulated_price_drop, tenant_tops_up_or_operator_protectively_sells, test_move_out_claim, tenant_accepts_claim, settlement_returns_remaining_shares]
    invariant: Share and cash collateral remains in the contract until its test claim and settlement rules release it.
    code: [contracts/evm/src/CollateralEscrow.sol, contracts/evm/src/testnet/TestnetMarket.sol, src/server/share-workflows.ts, src/components/share-workflows.tsx, src/components/stock-collateral.tsx]
    reality: testnet_simulated

  BorrowAgainstShares:
    definition: A separate Robinhood Chain testnet TestLendingPool accepts fake tTSLA as collateral and lends operator-funded test USD at a simulated per-wallet oracle price; existing legacy positions may use official test TSLA.
    rules:
      - Borrowing is limited to 50 % of the current test-price collateral value.
      - Liquidation is available at 80 % loan-to-value.
      - Repayment includes accrued test interest; remaining collateral can be withdrawn.
    code: [contracts/evm/src/testnet/TestLendingPool.sol, contracts/evm/src/testnet/TestnetMarket.sol, src/server/share-workflows.ts, src/components/share-workflows.tsx]
    reality: testnet_simulated

  HomeEquityPath:
    definition: Future legally defined housing interests or down-payment credit toward acquiring a home; the current fictional test-unit purchase does not grant those rights.
    reality: roadmap
    constraint: A real swap needs a legal wrapper, a notary and the land register; model it as down-payment credit.

  DeviceTokenization:
    definition: Selling shares of a ProductiveDevice's future income (solar, validator, car).
    reality: roadmap
    constraint: Securities and consumer-protection regulation; start with observation (Adapters).

journeys:
  tenant: [create_account, browse_listings, apply, accept_agreement, secure_deposit, claim_earnings_any_time, invest, move_out_respond, receive_payout]
  landlord: [create_account, post_listing, choose_applicant, invite_arbitrator, accept_agreement, create_deposit_space, propose_claim, receive_payout]
  arbitrator: [create_account, join_by_invitation, decide_disputed_claim]
  owner_of_things: [connect_adapter, see_everything_owned]   # any role
  journey_ui: {stages: [agreement, space, deposit, living, move-out, paid], code: src/server/journey.ts, rule: "Exactly one person has an action per phase; the others see what they wait for."}

networks:
  solana_devnet: {used_for: [Escrow, Operation, tSPYx market], rpc: "Helius (SOLANA_RPC_URL)"}
  robinhood_testnet: {chain_id: 46630, used_for: [RentalEscrow earnings demo, official test TSLA, CollateralDeposit with simulated per-wallet TestPriceOracle, BorrowAgainstShares in operator-funded TestLendingPool]}
  gnosis_beacon: {used_for: [validator adapter]}
  solana_mainnet_read: {used_for: [validator adapter, SPYx/TSLAx reference prices via Jupiter]}

test_tooling:   # never presented as wallet or user evidence
  test_signers: {code: [src/server/test-signer.ts, scripts/test-signer.mjs], purpose: "Operator keys play people end to end."}
  test_helpers: {code: src/server/test-helpers.ts, gate: "SOLANA_TEST_SIGNER_MODE=1, local store, loopback", purpose: "One real account walks the whole journey."}
  demo_mode: {env: [DEMO_SKIP_RECOVERY, NEXT_PUBLIC_DEMO_SKIP_RECOVERY], effect: "No recovery proof, optional backup email, no Privy confirmation modals."}

# ---------------------------------------------------------------------------
# Vision recorded 2026-09-26 (not built unless marked). Grounding for later work.
# ---------------------------------------------------------------------------
vision:
  scales:
    reality: illustration
    order: [person, household, neighbourhood, municipality, neighbouring_municipalities, landkreis, land, federation, eu, world]
    rule: Every Context sits at one scale; the app starts from what affects the person and widens outward.
    current: "Places links Strausberg city → Märkisch-Oderland district → Brandenburg state → Germany → EU official portals; street/neighbourhood and world feeds are not built."
  public_money_flow:
    reality: illustration
    current: "Places shows the sourced Strausberg budget ordinance's planned 2025 and 2026 investment outlays, never actual spending or personal tax receipts; an independently assumed local-economy balance is explicitly fictional."
    idea: Show where taxes go and what a person's city can realistically spend once the city publishes or provides a complete plan with reusable terms.
    grounding_de:
      - Income tax is shared; municipalities receive 15 % of wage and assessed income tax under GemFinRefG § 1, distributed by statutory keys linked to residence, not 15 % of each resident's personal bill.
      - Trade tax (Gewerbesteuer) belongs to the municipality where business operations take place; Gewerbesteuerumlage reduces gross municipal receipts under GemFinRefG § 6.
      - Brandenburg distributes key allocations to municipalities under BbgFAG; its provisions are legal rules, not a Strausberg allocation dataset.
      - Strausberg's 2025/26 budget ordinance is published, but the detailed plan is offered for inspection under BbgKVerf § 69; an electronic copy may be requested under Brandenburg's AIG.
    caution: Budget figures are planned yearly outlays, not actuals or project allocations; scenario receipts are independent inputs and no personal tax attribution is calculated.
  measurable_city:
    reality: read_only_live
    current: "Partly built: current DWD weather via Bright Sky and nearby outdoor PM2.5/PM10 from uncalibrated sensor.community contributors, with station/sensor distance, observation time, licence and stale status; not city-wide calibrated coverage."
    idea: Broader sensors and open data (Stadtstack layers 1-2) could make needs and effects of measures measurable.
  newcomer_welcome:
    reality: read_only_live
    current: "Partly built: named OSM clubs and sports facilities grouped by type, ODbL object links and Strausberg official directory links; OSM is not an official directory."
    idea: Registration help, interest-based offers, city partners and a welcome voucher are roadmap, not live product features.
    privacy: Interests stay with the person; future matching would occur on device or with explicit consent, never sold or shared by default.
  residence_proof:
    note: The EU PID may omit the address (test issuer form asks birthplace; address fields optional). Fall back to a chosen city, or a residence attestation where issued.
