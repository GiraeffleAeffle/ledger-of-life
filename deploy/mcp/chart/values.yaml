# Governed dispatcher provisions namespace, token Secret and exact binaryData
# revocation ConfigMap before applying its deterministic rendering of this chart.
# Candidate releaseVersion: 0.3.2; image.digest is the owner-approved immutable
# digest from the image workflow. Keep the live 0.3.1 deployment until accepted.
# Tags never replace immutable digests. Version must match package, Git and image.
releaseVersion: ""
image:
  repository: ghcr.io/giraeffleaeffle/stadtstack-mcp
  digest: ""
# Existing Secret contains validated {id, sha256, limits?} records. Optional limits
# contain requestsPerMinute (1..300) and maxConcurrent (1..8); absent means 60/4.
# Authorized release requires existing max and buzz explicitly 300/8, others 60/4.
# Keep existing digests: private CLI set-limits max 300 8; set-limits buzz 300 8.
# sha256 is the lowercase SHA-256 of the bearer token; never store plaintext tokens.
secretName: civic-mcp-token-hashes
# The governed wrapper hashes the validated configuration into this revision.
# Server loads once at startup: projected Secret updates alone do not activate it.
tokenSecretRevision: "1"
# SHA-256 of the signed revocation artifact bytes, not reserialized JSON.
# Changes force the release/revocation cohort to restart together.
revocationArtifactSha256: ""
# Exact public trust bytes are part of the same startup cohort.
revocationTrustSha256: ""
web:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
ingress:
  clusterIssuer: letsencrypt-prod
  # Actual governed Loyalty ingress is HAProxy in ingress-system, not ingress-nginx.
  # Host-network sources copied from that chart; owner refreshes from inventory.
  haproxySources:
    - 10.42.0.10/32
    - 10.42.0.11/32
    - 10.42.0.12/32
    - 10.244.0.0/32
    - 10.244.1.0/32
    - 10.244.2.0/32
    - 10.244.0.1/32
    - 10.244.1.1/32
    - 10.244.2.1/32
