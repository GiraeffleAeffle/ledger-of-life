{{- include "civicMcp.contract" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: civic-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/version: {{ .Values.releaseVersion | quote }}
spec:
  # Per-token rate limits are process-local: never overlap instances or add HPA.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: civic-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: civic-mcp
        app.kubernetes.io/version: {{ .Values.releaseVersion | quote }}
      annotations:
        civic-mcp.stadtstack.eu/token-secret-revision: {{ .Values.tokenSecretRevision | quote }}
        civic-mcp.stadtstack.eu/revocation-artifact-sha256: {{ .Values.revocationArtifactSha256 | quote }}
        civic-mcp.stadtstack.eu/revocation-trust-sha256: {{ .Values.revocationTrustSha256 | quote }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: {{ include "civicMcp.image" . | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4318
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: MCP_TOKEN_HASH_FILE
              value: /run/secrets/mcp/token-hashes.json
            - name: MCP_PUBLIC_ORIGIN
              value: https://mcp.stadtstack.eu
            - name: STADTSTACK_MCP_RELEASE_DIR
              value: /app/release
            - name: STADTSTACK_MCP_REVOCATION_TRUST_FILE
              value: /run/config/mcp-revocations/trust.json
            - name: STADTSTACK_MCP_REVOCATIONS_FILE
              value: /run/config/mcp-revocations/revocations.json
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: token-hashes
              mountPath: /run/secrets/mcp
              readOnly: true
            - name: mcp-revocations
              mountPath: /run/config/mcp-revocations
              readOnly: true
      volumes:
        - name: token-hashes
          secret:
            secretName: {{ required "secretName must identify an existing governed Secret" .Values.secretName | quote }}
            optional: false
            defaultMode: 0440
            items:
              - key: token-hashes.json
                path: token-hashes.json
        - name: mcp-revocations
          configMap:
            name: stadtstack-mcp-revocations
            optional: false
            defaultMode: 0444
            items:
              - key: trust.json
                path: trust.json
              - key: revocations.json
                path: revocations.json
