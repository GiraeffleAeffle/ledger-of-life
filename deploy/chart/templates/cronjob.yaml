apiVersion: batch/v1
kind: CronJob
metadata:
  name: ledger-of-life-reconcile
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ledger.helmLabels" . | nindent 4 }}
    app.kubernetes.io/name: ledger-of-life
    app.kubernetes.io/component: reconcile
spec:
  # Settles pending operations and removes stored AI questions after their grace period (docs/DEPLOYMENT.md).
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ledger-of-life
            app.kubernetes.io/component: reconcile
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconcile
              image: {{ include "ledger.image" . | quote }}
              imagePullPolicy: IfNotPresent
              command: ["node", "scripts/reconcile.mjs"]
              env:
                # The route checks the bearer secret, not the origin, so the in-cluster address is enough.
                - name: APP_ORIGIN
                  value: {{ printf "http://ledger-of-life.%s.svc.cluster.local:4175" .Release.Namespace | quote }}
                - name: RECONCILE_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: ledger-env
                      key: RECONCILE_SECRET
                      optional: false
              resources:
                {{- toYaml .Values.reconcile.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
