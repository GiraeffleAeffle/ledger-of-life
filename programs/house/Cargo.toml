[package]
name = "house"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "house"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "=0.32.1", default-features = false, features = ["token", "token_2022", "token_2022_extensions"] }

[dev-dependencies]
litesvm = "=0.7.1"
solana-account = "2.2"
solana-keypair = "2.2"
solana-message = "2.3"
solana-signer = "2.2"
solana-transaction = "2.2"
serde_json = "1"
