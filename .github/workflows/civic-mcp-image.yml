name: Civic MCP image

# Release publication is explicit; no branch pushes or automatic deployment.
on:
  push:
    tags:
      - 'civic-mcp-v*'

permissions:
  contents: read

concurrency:
  group: civic-mcp-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/giraeffleaeffle/stadtstack-mcp

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@05340d1c670183e7caabdb33ae9f1c80fae3b0c2 # v3.6.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,format=long
          flavor: latest=false
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: stadtstack-data
          file: stadtstack-data/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=civic-mcp
          cache-to: type=gha,mode=max,scope=civic-mcp
      - name: Report the immutable release digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Build did not return an immutable manifest digest."
            exit 1
          fi
          printf 'CIVIC_MCP_SOURCE=%s\nCIVIC_MCP_DIGEST=%s\n' "$GITHUB_SHA" "$DIGEST"
          {
            echo '### Civic MCP image'
            echo
            echo "Image: \`${IMAGE}@${DIGEST}\`"
            echo "Platforms: \`linux/amd64\`, \`linux/arm64\`"
            echo "Release: \`${GITHUB_REF_NAME}\`"
            echo "Source commit: \`${GITHUB_SHA}\`"
            echo
            echo 'Pin this multiarchitecture manifest digest in the governed deployment values:'
            echo '```yaml'
            echo 'image:'
            echo "  digest: ${DIGEST}"
            echo '```'
            echo
            echo 'Release: `civic-mcp`; existing namespace: `stadtstack-mcp`; chart: `deploy/mcp/chart`.'
            echo 'The governed wrapper provisions the token-hash Secret and namespace; this workflow never deploys.'
            echo 'The first GHCR push can create a private package. Make the package public for unauthenticated cluster pulls.'
          } >> "$GITHUB_STEP_SUMMARY"
