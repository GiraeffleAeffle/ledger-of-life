[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./deployments" }]

[fuzz]
runs = 256

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
